---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: records-controller
rules:
- apiGroups:
  - records.crossplane.io
  resources:
  - clusterschemas
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - records.crossplane.io
  resources:
  - clusterschemas/status
  - records/status
  - recordsets/status
  - schemas/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - records.crossplane.io
  resourceNames:
  - records.crossplane.io
  resources:
  - groups
  verbs:
  - publish
- apiGroups:
  - records.crossplane.io
  resources:
  - records
  - recordsets
  - schemas
  verbs:
  - get
  - list
  - watch
