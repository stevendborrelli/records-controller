---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: schemas.records.crossplane.io
spec:
  group: records.crossplane.io
  names:
    kind: Schema
    listKind: SchemaList
    plural: schemas
    singular: schema
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.shapeGroup
      name: Group
      type: string
    - jsonPath: .spec.shape
      name: Shape
      type: string
    - jsonPath: .spec.shapeVersion
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.digest
      name: Digest
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A Schema is a namespaced contract that Records validate against.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SchemaSpec is the contract and Publisher metadata shared by Schema and
              ClusterSchema. Publisher, the lineage (shapeGroup, shape, and
              shapeVersion), format, and definition are immutable; replaces and
              deprecation are mutable Publisher assertions. Only format and definition
              are inputs to the contract digest.
            properties:
              definition:
                description: |-
                  Definition is the contract, expressed in the schema language
                  identified by format.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              deprecation:
                description: Deprecation, when present, declares the Schema deprecated.
                properties:
                  date:
                    description: Date is an RFC 3339 full-date, interpreted as a calendar
                      date in UTC.
                    format: date
                    type: string
                  message:
                    description: Message is an optional human-readable explanation.
                    type: string
                required:
                - date
                type: object
              format:
                description: Format is the schema language of the definition.
                enum:
                - StructuralSchema
                type: string
              publisher:
                description: Publisher of the Schema.
                properties:
                  id:
                    description: ID of the Publisher.
                    minLength: 1
                    type: string
                required:
                - id
                type: object
              replaces:
                description: Replaces identifies Schemas this Schema is the intended
                  successor to.
                items:
                  description: |-
                    SchemaReference refers to a Schema or ClusterSchema. A reference to a
                    Schema has no namespace; it always resolves in the referencing object's own
                    namespace.
                  properties:
                    kind:
                      description: Kind of the referenced Schema.
                      enum:
                      - Schema
                      - ClusterSchema
                      type: string
                    name:
                      description: Name of the referenced Schema.
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                maxItems: 32
                type: array
              shape:
                description: |-
                  Shape is the form of data within the shapeGroup, like a Kubernetes
                  kind.
                maxLength: 63
                minLength: 1
                type: string
              shapeGroup:
                description: |-
                  ShapeGroup owns the contract lineage, like a Kubernetes API group.
                  Together with shape it identifies the lineage. It is a claim, not
                  proof that the Publisher controls the domain.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              shapeVersion:
                description: |-
                  ShapeVersion is a Publisher-asserted compatibility group within the
                  lineage, like a Kubernetes API version. Several Schemas may share a
                  shapeVersion; each is an immutable revision.
                maxLength: 63
                minLength: 1
                type: string
            required:
            - definition
            - format
            - publisher
            - shape
            - shapeGroup
            - shapeVersion
            type: object
            x-kubernetes-validations:
            - message: spec.publisher is immutable
              rule: self.publisher == oldSelf.publisher
            - message: spec.shapeGroup is immutable
              rule: self.shapeGroup == oldSelf.shapeGroup
            - message: spec.shape is immutable
              rule: self.shape == oldSelf.shape
            - message: spec.shapeVersion is immutable
              rule: self.shapeVersion == oldSelf.shapeVersion
            - message: spec.format is immutable
              rule: self.format == oldSelf.format
            - message: spec.definition is immutable
              rule: self.definition == oldSelf.definition
          status:
            description: SchemaStatus is the observed state of a Schema or ClusterSchema.
            properties:
              conditions:
                description: Conditions of the Schema.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              digest:
                description: Digest of the canonicalized contract. Write-once.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled.
                format: int64
                type: integer
            type: object
            x-kubernetes-validations:
            - message: status.digest is write-once
              rule: '!has(oldSelf.digest) || (has(self.digest) && self.digest == oldSelf.digest)'
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.shapeGroup
    - jsonPath: .spec.shape
    - jsonPath: .spec.shapeVersion
    served: true
    storage: true
    subresources:
      status: {}
