---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: recordsets.records.crossplane.io
spec:
  group: records.crossplane.io
  names:
    kind: RecordSet
    listKind: RecordSetList
    plural: recordsets
    singular: recordset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.recordTypeGroup
      name: Group
      type: string
    - jsonPath: .spec.recordType
      name: Type
      type: string
    - jsonPath: .spec.current
      name: Current
      type: integer
    - jsonPath: .spec.highestVersion
      name: Highest
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A RecordSet is a mutable, Publisher-owned index over immutable
          Records.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RecordSetSpec is the Publisher-owned index over a collection
              of Records.
            properties:
              current:
                description: Current is the version the Publisher recommends.
                format: int64
                minimum: 1
                type: integer
              highestVersion:
                description: |-
                  HighestVersion is the highest version number the RecordSet has ever
                  published. The Publisher raises it in the same update that publishes
                  a higher version. It never decreases, so a version number cannot be
                  reused after the version is removed. Required when versions is set.
                format: int64
                minimum: 1
                type: integer
              publisher:
                description: Publisher of the RecordSet.
                properties:
                  id:
                    description: ID of the Publisher.
                    minLength: 1
                    type: string
                required:
                - id
                type: object
              recordType:
                description: RecordType of every Record in the set.
                minLength: 1
                type: string
              recordTypeGroup:
                description: RecordTypeGroup of every Record in the set.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              retention:
                description: Retention is the Publisher's retention policy for versions.
                properties:
                  maxVersions:
                    description: |-
                      MaxVersions is the most versions the RecordSet may list. The
                      Publisher removes the oldest versions when publishing would exceed
                      it.
                    format: int64
                    maximum: 100
                    minimum: 1
                    type: integer
                required:
                - maxVersions
                type: object
              retracted:
                description: Retracted versions.
                items:
                  description: Retraction marks a published version as retracted.
                  properties:
                    message:
                      description: Message explains the retraction.
                      type: string
                    version:
                      description: Version that is retracted.
                      format: int64
                      minimum: 1
                      type: integer
                  required:
                  - version
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - version
                x-kubernetes-list-type: map
              versions:
                description: Versions ordered from highest to lowest version number.
                items:
                  description: |-
                    RecordSetVersion is one published version of a RecordSet. Entries are
                    immutable once published.
                  properties:
                    publishedAt:
                      description: PublishedAt is when the version was published.
                      format: date-time
                      type: string
                    recordRef:
                      description: RecordRef identifies the Record published as this
                        version.
                      properties:
                        dataDigest:
                          description: DataDigest is the expected digest of the Record's
                            data.
                          pattern: ^sha256:[0-9a-f]{64}$
                          type: string
                        name:
                          description: Name of the Record.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    schemaRef:
                      description: SchemaRef identifies the Record's contract.
                      properties:
                        digest:
                          description: Digest is the expected digest of the Record's
                            contract.
                          pattern: ^sha256:[0-9a-f]{64}$
                          type: string
                        kind:
                          description: Kind of the referenced Schema.
                          enum:
                          - Schema
                          - ClusterSchema
                          type: string
                        name:
                          description: Name of the referenced Schema.
                          minLength: 1
                          type: string
                        structuralDigest:
                          description: |-
                            StructuralDigest is the expected structural digest of the Record's
                            contract. Consumers can filter versions by it without resolving
                            Records or Schemas.
                          pattern: ^sha256:[0-9a-f]{64}$
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    version:
                      description: Version number. Positive, never reused, and increasing.
                      format: int64
                      minimum: 1
                      type: integer
                  required:
                  - recordRef
                  - schemaRef
                  - version
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - version
                x-kubernetes-list-type: map
            required:
            - publisher
            - recordType
            - recordTypeGroup
            type: object
            x-kubernetes-validations:
            - message: current must identify a published version
              rule: '!has(self.current) || (has(self.versions) && self.versions.exists(v,
                v.version == self.current))'
            - message: current must not identify a retracted version
              rule: '!has(self.current) || !has(self.retracted) || !self.retracted.exists(r,
                r.version == self.current)'
            - message: retracted versions must be published versions
              rule: '!has(self.retracted) || self.retracted.all(r, has(self.versions)
                && self.versions.exists(v, v.version == r.version))'
            - message: spec.publisher is immutable
              rule: self.publisher == oldSelf.publisher
            - message: spec.recordTypeGroup is immutable
              rule: self.recordTypeGroup == oldSelf.recordTypeGroup
            - message: spec.recordType is immutable
              rule: self.recordType == oldSelf.recordType
            - message: new versions must be greater than every existing version
              rule: '!has(self.versions) || !has(oldSelf.versions) || self.versions.all(v,
                oldSelf.versions.exists(o, o.version == v.version) || oldSelf.versions.all(o,
                o.version < v.version))'
            - message: published version entries are immutable
              rule: '!has(self.versions) || !has(oldSelf.versions) || self.versions.all(v,
                oldSelf.versions.all(o, o.version != v.version || o == v))'
            - message: highestVersion must be set and at least every published version
              rule: '!has(self.versions) || (has(self.highestVersion) && self.versions.all(v,
                v.version <= self.highestVersion))'
            - message: highestVersion must not decrease
              rule: '!has(oldSelf.highestVersion) || (has(self.highestVersion) &&
                self.highestVersion >= oldSelf.highestVersion)'
            - message: 'version numbers must not be reused: new versions must be greater
                than the previous highestVersion'
              rule: '!has(self.versions) || !has(oldSelf.highestVersion) || self.versions.all(v,
                (has(oldSelf.versions) && oldSelf.versions.exists(o, o.version ==
                v.version)) || v.version > oldSelf.highestVersion)'
            - message: versions must not exceed retention.maxVersions; remove the
                oldest versions when publishing
              rule: '!has(self.retention) || !has(self.versions) || size(self.versions)
                <= self.retention.maxVersions'
          status:
            description: RecordSetStatus is the observed state of a RecordSet.
            properties:
              conditions:
                description: Conditions of the RecordSet.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentRecord:
                description: CurrentRecord is the name of the Record that current
                  resolves to.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.recordTypeGroup
    - jsonPath: .spec.recordType
    served: true
    storage: true
    subresources:
      status: {}
