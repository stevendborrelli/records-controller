apiVersion: apps/v1
kind: Deployment
metadata:
  name: records-controller
  labels:
    app.kubernetes.io/name: records-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: records-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: records-controller
    spec:
      serviceAccountName: records-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: records-controller:dev
          imagePullPolicy: IfNotPresent
          args:
            - --health-probe-bind-address=:8081
          ports:
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /healthz
              port: probes
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
