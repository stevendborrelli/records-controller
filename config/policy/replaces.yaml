# replaces is a claim a Schema makes about other Schemas. Only someone allowed
# to update a Schema may claim to replace it. Entries already present are not
# re-checked, so a Publisher can keep editing a Schema whose replaces was set
# by someone else.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: records-replaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["records.crossplane.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["schemas", "clusterschemas"]
  variables:
    - name: added
      expression: >-
        has(object.spec.replaces) ? object.spec.replaces.filter(r,
        oldObject == null || !has(oldObject.spec.replaces) ||
        !oldObject.spec.replaces.exists(o, o.kind == r.kind && o.name == r.name)) : []
  validations:
    - expression: >-
        variables.added.all(r, r.kind == 'ClusterSchema'
        ? authorizer.group('records.crossplane.io').resource('clusterschemas').name(r.name).check('update').allowed()
        : authorizer.group('records.crossplane.io').resource('schemas').namespace(object.metadata.namespace).name(r.name).check('update').allowed())
      message: replaces may name only Schemas the requester is authorized to update
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: records-replaces
spec:
  policyName: records-replaces
  validationActions: [Deny]
